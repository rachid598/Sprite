name: Deploy to GitHub Pages

# GitHub Pages sert la branche `gh-pages` (source « Deploy from a branch »).
# Ce workflow la garde alignée sur la branche par défaut à chaque push.
# Le site est statique : rien à construire, on republie l'arbre tel quel.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publier sur gh-pages
        run: |
          git push --force origin \
            "${GITHUB_SHA}:refs/heads/gh-pages"
